<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vox</title>
    <!-- trek:ui -->
    <style>
        /* Everything below rides on the tokens the design kit applies from the
           host, so the accent, high-contrast and dark mode follow TREK. Only
           the amber of a vote is ours: it is not a host token. */
        :root {
            --vox-vote: #d98a0b;
        }

        :root[data-theme="dark"] {
            --vox-vote: #e8b34a;
        }

        body {
            margin: 0;
        }

        .vox {
            max-width: 880px;
            margin: 0 auto;
            padding: 18px 16px 56px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* --- header ------------------------------------------------------ */
        .vox-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vox-head h1 {
            font-size: 19px;
            font-weight: 650;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .vox-head .grow {
            flex: 1 1 auto;
            min-width: 0;
        }

        .status {
            font-size: 12.5px;
            color: var(--text-muted, #888);
            margin-top: 3px;
        }

        /* --- search + filters -------------------------------------------- */
        .searchbar {
            position: relative;
            display: flex;
            align-items: center;
        }

        .searchbar input {
            padding-left: 32px;
            padding-right: 78px;
        }

        .searchbar .glyph {
            position: absolute;
            left: 11px;
            font-size: 13px;
            color: var(--text-faint, #aaa);
            pointer-events: none;
        }

        .searchbar .count {
            position: absolute;
            right: 38px;
            font-size: 11.5px;
            color: var(--text-muted, #888);
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .searchbar .clear {
            position: absolute;
            right: 8px;
            appearance: none;
            border: 0;
            background: none;
            color: var(--text-muted, #888);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm, 6px);
        }

        .searchbar .clear:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .14));
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-faint, rgba(128, 128, 128, .2));
        }

        .controls select {
            width: auto;
            min-width: 156px;
        }

        /* A lens over the list, so its pressed state has to be unmistakable. */
        .lens {
            appearance: none;
            font: inherit;
            font-size: 12.5px;
            font-weight: 550;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            background: none;
            color: var(--text-secondary, #555);
            border: 1px solid var(--border-faint, rgba(128, 128, 128, .28));
        }

        .lens:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .1));
        }

        .lens[aria-pressed="true"] {
            background: var(--accent, #333);
            color: var(--accent-text, #fff);
            border-color: transparent;
        }

        .lens .n {
            opacity: .65;
            font-variant-numeric: tabular-nums;
            margin-left: 4px;
        }

        /* --- section + area headings -------------------------------------- */
        .band {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: var(--text-muted, #888);
            margin-top: 6px;
        }

        .band::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-faint, rgba(128, 128, 128, .2));
        }

        /* The whole point of the area row: decide whether to open it without
           opening it. */
        .area-head {
            appearance: none;
            width: 100%;
            text-align: left;
            font: inherit;
            background: none;
            border: 0;
            border-radius: var(--radius-sm, 6px);
            padding: 7px 8px;
            cursor: pointer;
            display: flex;
            align-items: baseline;
            gap: 9px;
            flex-wrap: wrap;
            color: var(--text-primary, #111);
        }

        .area-head:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .1));
        }

        .area-head .caret {
            font-size: 11px;
            color: var(--text-secondary, #666);
            width: 11px;
            flex: none;
        }

        .area-head .nm {
            font-size: 13.5px;
            font-weight: 650;
        }

        .area-head .sum {
            font-size: 12px;
            color: var(--text-muted, #888);
            font-variant-numeric: tabular-nums;
        }

        .area-head .todo {
            color: var(--warning, #b45309);
            font-weight: 600;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list.indent {
            padding-left: 17px;
        }

        /* --- card -------------------------------------------------------- */
        .act {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 12px 14px;
        }

        .act-top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .act-name {
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: -0.005em;
        }

        .act-note {
            font-size: 12.5px;
            color: var(--text-secondary, #666);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* One row carries the whole verdict: number, gauge, turnout, ballot. */
        .verdict {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score {
            font-size: 21px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .score.none {
            color: var(--text-faint, #999);
        }

        .gauge {
            width: 74px;
            height: 3px;
            border-radius: 999px;
            background: var(--bg-hover, rgba(128, 128, 128, .16));
            overflow: hidden;
            flex: none;
        }

        .gauge > i {
            display: block;
            height: 100%;
            border-radius: 999px;
            background: var(--vox-vote);
            transition: width .25s ease;
        }

        .turnout {
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-size: 12.5px;
            color: var(--text-muted, #888);
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            text-decoration: underline dotted;
            text-underline-offset: 3px;
        }

        .turnout.plain {
            cursor: default;
            text-decoration: none;
        }

        .waiting {
            font-size: 12.5px;
            color: var(--warning, #b45309);
            font-weight: 550;
        }

        .verdict .spacer {
            flex: 1 1 auto;
        }

        /* --- the vote control -------------------------------------------- */
        .ballot {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .stars {
            display: inline-flex;
            gap: 1px;
        }

        .star {
            appearance: none;
            border: 0;
            background: none;
            padding: 1px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            color: var(--text-faint, #aaa);
            transition: color .12s ease, transform .12s ease;
        }

        .star.on {
            color: var(--vox-vote);
        }

        .star:hover {
            transform: scale(1.14);
        }

        .star:disabled {
            cursor: default;
            transform: none;
        }

        /* The label is bound to the VALUE, not to the pointer: it follows the
           hover on a desktop and states — then confirms — the choice on touch,
           where there is no hover at all.

           The slot is sized by an invisible copy of the LONGEST label, so the
           pill never changes width as you sweep across the stars. Without it
           the row's spacer gives way, the whole ballot slides sideways, and the
           star under the cursor is no longer the one you meant to click. A
           hidden twin beats a magic pixel width: it stays correct whatever font
           and locale the host is in. */
        .vlabel-slot {
            position: relative;
            display: inline-block;
            flex: none;
        }

        .vlabel {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: var(--radius-sm, 6px);
            white-space: nowrap;
            text-align: center;
            color: var(--vox-vote);
            background: rgba(217, 138, 11, .14);
            background: color-mix(in srgb, var(--vox-vote) 14%, transparent);
        }

        .vlabel.ghost {
            visibility: hidden;
            pointer-events: none;
            display: block;
        }

        .vlabel.live {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vlabel.none {
            color: var(--text-muted, #888);
            background: var(--bg-hover, rgba(128, 128, 128, .12));
        }

        /* --- voter breakdown, on demand ----------------------------------- */
        .breakdown {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-top: 7px;
            border-top: 1px solid var(--border-faint, rgba(128, 128, 128, .18));
        }

        .breakdown .vrow {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 12.5px;
        }

        .breakdown .vrow .nm {
            color: var(--text-secondary, #555);
        }

        .breakdown .vrow .sc {
            margin-left: auto;
            color: var(--vox-vote);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .breakdown .vrow.absent .nm,
        .breakdown .vrow.absent .sc {
            color: var(--text-faint, #aaa);
            font-style: italic;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
        }

        .act-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .act-actions .spacer {
            flex: 1 1 auto;
        }

        /* --- overflow menu ----------------------------------------------- */
        .menu-wrap {
            position: relative;
            margin-left: auto;
        }

        .menu-btn {
            appearance: none;
            border: 0;
            background: none;
            color: var(--text-muted, #888);
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm, 6px);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1;
        }

        .menu-btn:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .12));
            color: var(--text-primary, #111);
        }

        .menu {
            position: absolute;
            top: 28px;
            right: 0;
            z-index: 40;
            min-width: 184px;
            padding: 5px;
            border-radius: var(--radius-md, 10px);
            background: var(--bg-card, #fff);
            border: 1px solid var(--border-faint, rgba(128, 128, 128, .2));
            box-shadow: var(--shadow-lg, 0 10px 30px rgba(0, 0, 0, .18));
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .menu button {
            appearance: none;
            border: 0;
            background: none;
            text-align: left;
            font: inherit;
            font-size: 13px;
            padding: 7px 10px;
            border-radius: var(--radius-sm, 6px);
            color: var(--text-primary, #111);
            cursor: pointer;
        }

        .menu button:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .12));
        }

        .menu button.danger {
            color: var(--danger, #dc2626);
        }

        /* --- in-the-trip row --------------------------------------------- */
        .trip-row {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            padding: 10px 14px;
        }

        .trip-row .act-name {
            font-size: 14px;
        }

        .link-btn {
            appearance: none;
            border: 0;
            background: none;
            padding: 2px 4px;
            border-radius: var(--radius-sm, 6px);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent, #333);
            cursor: pointer;
            align-self: center;
            white-space: nowrap;
        }

        .link-btn:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .12));
        }

        /* --- empty ------------------------------------------------------- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            padding: 26px 20px;
        }

        .empty h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 650;
        }

        .empty p {
            margin: 0;
            max-width: 46ch;
            font-size: 13.5px;
            color: var(--text-secondary, #666);
        }

        /* --- modal ------------------------------------------------------- */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .modal {
            width: 100%;
            max-width: 460px;
            max-height: calc(100vh - 36px);
            overflow-y: auto;
            padding: 20px;
            border-radius: var(--radius-lg, 14px);
            background: var(--bg-card, #fff);
            border: 1px solid var(--border-faint, rgba(128, 128, 128, .2));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 650;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field .hint {
            font-size: 11.5px;
            color: var(--text-muted, #888);
        }

        /* Suggestions sit in the flow, not in a floating layer, so nothing can
           clip them against the dialog's scroll edge. */
        .suggest {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 2px;
            align-items: center;
        }

        .suggest:empty {
            display: none;
        }

        .suggest-item {
            appearance: none;
            font: inherit;
            font-size: 12.5px;
            padding: 3px 10px;
            border-radius: 999px;
            cursor: pointer;
            background: none;
            color: var(--text-secondary, #555);
            border: 1px solid var(--border-faint, rgba(128, 128, 128, .28));
        }

        .suggest-item:hover {
            background: var(--bg-hover, rgba(128, 128, 128, .12));
            color: var(--text-primary, #111);
        }

        .suggest-item.on {
            background: var(--accent, #333);
            color: var(--accent-text, #fff);
            border-color: transparent;
        }

        .suggest-new {
            font-size: 11.5px;
            color: var(--text-muted, #888);
            padding: 3px 2px;
        }

        .pair {
            display: flex;
            gap: 6px;
        }

        .pair > :first-child {
            flex: 1 1 auto;
            min-width: 0;
        }

        /* When the dialog does have to scroll, the buttons stay put instead of
           disappearing off the bottom. The negative offset cancels the dialog's
           own padding so it settles flush against the edge. */
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 2px;
            position: sticky;
            bottom: -20px;
            padding: 12px 0;
            margin-bottom: -20px;
            background: var(--bg-card, #fff);
        }

        .modal-actions .grow {
            flex: 1 1 auto;
        }

        @media (max-width: 640px) {
            .backdrop {
                align-items: flex-end;
                padding: 0;
            }

            .modal {
                max-width: none;
                border-radius: var(--radius-lg, 14px) var(--radius-lg, 14px) 0 0;
                max-height: 88vh;
            }

            .list.indent {
                padding-left: 0;
            }

            /* Voting is the whole job on a phone, and five adjacent targets at
               19px is a mistap waiting to happen. The verdict row already wraps
               here, so the stars have the card to themselves — spend it on the
               tap area. A wrong tap is instantly visible in the label and one
               tap away from being fixed. */
            .star {
                font-size: 24px;
                padding: 8px;
            }

            .stars {
                gap: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
<div class="vox" id="app"></div>

<script>
    "use strict";
    (function () {
        var LABELS = {1: 'Really not', 2: 'Rather not', 3: 'Fine either way', 4: 'Keen', 5: 'Must do'};
        // Widest of every string the pill can ever hold, so the slot that
        // reserves its width covers all of them.
        var WIDEST_LABEL = [1, 2, 3, 4, 5].map(function (n) { return LABELS[n]; })
            .concat(['Not voted', 'Saving…'])
            .reduce(function (a, b) { return b.length > a.length ? b : a; });
        var SORTS = [
            ['pick', 'Group pick'],
            ['votes', 'Most votes'],
            ['new', 'Newest'],
            ['split', 'Most divided']
        ];
        var UNSORTED = 'Unsorted';
        // Above this many areas, browsing beats scrolling: areas start folded.
        var FOLD_AREAS_ABOVE = 4;
        var FOLD_TRIP_ABOVE = 6;

        var S = {
            tripId: null,
            userId: null,
            board: null,
            sort: 'pick',
            group: false,
            groupTouched: false,
            query: '',
            lens: {mine: false, split: false, ready: false},
            folded: {},
            tripFolded: false,
            wasNarrowing: false,
            open: {},
            loading: true,
            error: null
        };

        var app = document.getElementById('app');

        // ---- tiny DOM builder ---------------------------------------------
        // Everything user-supplied goes in through `text`, which is
        // textContent. No template concatenation, so an activity title or URL
        // is data and can never become markup.
        function h(tag, props, kids) {
            var n = document.createElement(tag);
            props = props || {};
            Object.keys(props).forEach(function (k) {
                var v = props[k];
                if (v == null || v === false) return;
                if (k === 'text') n.textContent = v;
                else if (k === 'class') n.className = v;
                else if (k === 'on') Object.keys(v).forEach(function (ev) { n.addEventListener(ev, v[ev]); });
                else if (k === 'style') n.setAttribute('style', v);
                else if (k in n && k !== 'list') n[k] = v;
                else n.setAttribute(k, v);
            });
            (Array.isArray(kids) ? kids : kids ? [kids] : []).forEach(function (c) {
                if (c == null || c === false) return;
                n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
            });
            return n;
        }

        function clear(n) {
            while (n.firstChild) n.removeChild(n.firstChild);
        }

        // ---- formatting ---------------------------------------------------
        function scoreText(a) {
            return a.avg_score == null ? '—' : a.avg_score.toFixed(1);
        }

        function turnoutText(a) {
            var total = S.board ? S.board.member_count : 0;
            if (!a.vote_count) return 'no votes yet';
            if (!total) return a.vote_count === 1 ? '1 vote' : a.vote_count + ' votes';
            return a.vote_count + ' of ' + total + ' voted';
        }

        function waitingText(a) {
            var m = a.missing || [];
            if (!m.length) return null;
            if (m.length === 1) return 'waiting on ' + m[0].name;
            if (m.length === 2) return 'waiting on ' + m[0].name + ' and ' + m[1].name;
            return 'waiting on ' + m.length + ' people';
        }

        function isHttp(url) {
            return /^https?:\/\//i.test(String(url || '').trim());
        }

        // The sandbox cannot open a tab itself — only the host can. If this kit
        // has no openExternal, say so instead of doing nothing.
        function openLink(url) {
            if (window.trek && typeof trek.openExternal === 'function') {
                trek.openExternal(url);
                return;
            }
            if (window.trek && typeof trek.notify === 'function') {
                trek.notify('warning', 'This TREK version cannot open links from a plugin');
            }
        }

        function areaOf(a) {
            return a.area_name || UNSORTED;
        }

        // ---- api ----------------------------------------------------------
        function api(sub, method, payload) {
            return trek.invoke(sub, {method: method || 'GET', body: payload});
        }

        /**
         * The wire format is deliberately lean: a ballot is `{u, s}` pairs and
         * nothing else. Names and area labels live ONCE on the board, and are
         * stitched back onto each activity here — so the payload does not
         * repeat a display name per member per proposal. Everything below this
         * point reads the stitched fields and never the raw ballot.
         */
        function hydrate(board) {
            var nameOf = {};
            var areaName = {};
            (board.members || []).forEach(function (m) { nameOf[String(m.id)] = m.name; });
            (board.areas || []).forEach(function (ar) { areaName[String(ar.id)] = ar.name; });
            board._nameOf = nameOf;
            board._areaName = areaName;
            (board.deciding || []).concat(board.in_trip || []).forEach(function (a) { hydrateOne(a, board); });
        }

        function hydrateOne(a, board) {
            if (!board) return;
            a.area_name = a.area_id != null ? (board._areaName[String(a.area_id)] || null) : null;

            var voted = {};
            a.voters = (a.ballot || []).map(function (b) {
                voted[String(b.u)] = true;
                return {
                    user_id: String(b.u),
                    // Someone who has since left the trip is no longer on the
                    // roster, so their vote is labelled rather than dropped.
                    name: board._nameOf[String(b.u)] || 'Former member',
                    score: b.s
                };
            }).sort(function (x, y) { return y.score - x.score; });

            a.missing = (board.members || [])
                .filter(function (m) { return !voted[String(m.id)]; })
                .map(function (m) { return {user_id: String(m.id), name: m.name}; });
        }

        function loadBoard() {
            if (S.tripId == null) return Promise.resolve();
            S.loading = !S.board;
            S.error = null;
            render();
            return api('/board?tripId=' + encodeURIComponent(S.tripId) + '&sort=' + S.sort)
                .then(function (board) {
                    hydrate(board);
                    S.board = board;
                    var areas = (board.areas || []).length;
                    // Grouping earns its place only when there is more than one
                    // area. The user's own choice always wins.
                    if (!S.groupTouched) S.group = areas > 1;
                    initFolds();
                    S.tripFolded = (board.in_trip || []).length > FOLD_TRIP_ABOVE;
                    S.loading = false;
                    render();
                })
                .catch(function (e) {
                    S.loading = false;
                    S.error = e && e.message ? e.message : 'Could not load Vox';
                    render();
                });
        }

        // Past a handful of areas, fold everything: nine summary lines are a
        // table of contents you can read in three seconds, where nine open
        // sections are just a longer scroll. One area opens — the first that is
        // waiting on you — so you still land on something actionable, and the
        // "Needs my vote" lens is the way to sweep the rest.
        function initFolds() {
            var groups = {};
            var order = [];
            (S.board.deciding || []).forEach(function (a) {
                var k = areaOf(a);
                if (!groups[k]) {
                    groups[k] = {pending: 0};
                    order.push(k);
                }
                if (a.my_score == null) groups[k].pending++;
            });

            S.folded = {};
            if (order.length <= FOLD_AREAS_ABOVE) return;

            order.sort(function (x, y) {
                if (x === UNSORTED) return 1;
                if (y === UNSORTED) return -1;
                return x.localeCompare(y);
            });
            var opened = false;
            order.forEach(function (k) {
                var openThis = !opened && groups[k].pending > 0;
                if (openThis) opened = true;
                S.folded[k] = !openThis;
            });
        }

        // ---- vote ---------------------------------------------------------
        function vote(activity, score) {
            var previous = activity.my_score;
            if (previous === score) return;

            // Paint first, reconcile after: a tap must feel instant even on a
            // phone halfway up a mountain.
            activity.my_score = score;
            activity._saving = true;
            render();

            api('/vote', 'POST', {activityId: activity.id, score: score})
                .then(function (r) {
                    activity.my_score = r.my_score;
                    activity.vote_count = r.vote_count;
                    activity.avg_score = r.avg_score;
                    activity.rank_score = r.rank_score;
                    activity.split = r.split;
                    activity.ballot = r.ballot;
                    activity._saving = false;
                    if (S.board) S.board.member_count = r.member_count;
                    // Same lean shape as a board row, so the same stitcher.
                    hydrateOne(activity, S.board);
                    recountPending();
                    render();
                })
                .catch(function (e) {
                    activity.my_score = previous;
                    activity._saving = false;
                    render();
                    trek.notify('error', 'Vote not saved: ' + (e && e.message ? e.message : 'unknown error'));
                });
        }

        function recountPending() {
            if (!S.board) return;
            S.board.pending_for_me = S.board.deciding.filter(function (a) { return a.my_score == null; }).length;
        }

        // ---- lenses -------------------------------------------------------
        function isReady(a) {
            return a.vote_count > 0 && (!a.missing || a.missing.length === 0);
        }

        function matches(a, q) {
            if (!q) return true;
            return (a.title + ' ' + (a.description || '') + ' ' + (a.area_name || '')).toLowerCase().indexOf(q) >= 0;
        }

        function visible(items) {
            var q = S.query.trim().toLowerCase();
            return items.filter(function (a) {
                if (!matches(a, q)) return false;
                if (S.lens.mine && a.my_score != null) return false;
                if (S.lens.split && !a.split) return false;
                if (S.lens.ready && !isReady(a)) return false;
                return true;
            });
        }

        function narrowing() {
            return !!(S.query.trim() || S.lens.mine || S.lens.split || S.lens.ready);
        }

        /**
         * Folding is for browsing a long board; a search or a lens has already
         * done that reduction, so everything opens up — otherwise you narrow to
         * 26 proposals and stare at nine closed rows. Restores the index when
         * the narrowing is cleared. Only fires on the transition, so folding an
         * area by hand mid-search survives the next keystroke.
         */
        function syncFolds() {
            var now = narrowing();
            if (now === S.wasNarrowing) return;
            S.wasNarrowing = now;
            if (now) {
                S.folded = {};
                S.tripFolded = false;
            } else {
                initFolds();
                S.tripFolded = ((S.board && S.board.in_trip) || []).length > FOLD_TRIP_ABOVE;
            }
        }

        // ---- render -------------------------------------------------------
        function render() {
            clear(app);

            if (S.tripId == null) {
                app.appendChild(noTrip());
                return;
            }

            app.appendChild(header());

            if (S.loading) {
                app.appendChild(h('div', {class: 'trek-card trek-skeleton', style: 'height:84px'}));
                app.appendChild(h('div', {class: 'trek-card trek-skeleton', style: 'height:84px'}));
                return;
            }
            if (S.error) {
                app.appendChild(h('div', {class: 'trek-card'}, [
                    h('div', {class: 'trek-title', text: 'Vox could not load'}),
                    h('p', {class: 'trek-muted', text: S.error}),
                    h('button', {class: 'trek-btn trek-btn--secondary', type: 'button', text: 'Try again', on: {click: loadBoard}})
                ]));
                return;
            }
            if (!S.board) return;

            var deciding = S.board.deciding || [];
            var inTrip = S.board.in_trip || [];

            if (!deciding.length && !inTrip.length) {
                app.appendChild(firstRun());
                return;
            }

            syncFolds();

            if (deciding.length + inTrip.length > 6) app.appendChild(searchbar(deciding));
            app.appendChild(controls(deciding));

            var shownDeciding = visible(deciding);
            var shownTrip = visible(inTrip);

            if (!shownDeciding.length && !shownTrip.length) {
                app.appendChild(noMatches());
                return;
            }

            if (shownDeciding.length) {
                app.appendChild(h('div', {class: 'band', text: 'Deciding · ' + shownDeciding.length}));
                // Grouping is independent of the search and the lenses: they
                // combine. One rule, no exceptions — narrowing to your own
                // homework and still working through it area by area is the
                // common case, not an edge case.
                if (S.group) {
                    var totals = areaTotals(deciding);
                    groupByArea(shownDeciding).forEach(function (g) { app.appendChild(areaSection(g, totals)); });
                } else {
                    app.appendChild(listOf(shownDeciding, card, false));
                }
            }

            if (shownTrip.length) {
                var band = h('div', {class: 'band'}, [
                    h('span', {text: 'In the trip · ' + shownTrip.length})
                ]);
                if (inTrip.length > FOLD_TRIP_ABOVE) {
                    band = h('button', {
                        class: 'area-head',
                        type: 'button',
                        'aria-expanded': S.tripFolded ? 'false' : 'true',
                        on: {click: function () { S.tripFolded = !S.tripFolded; render(); }}
                    }, [
                        h('span', {class: 'caret', text: S.tripFolded ? '▸' : '▾'}),
                        h('span', {class: 'nm', text: 'In the trip'}),
                        h('span', {class: 'sum', text: shownTrip.length + ' added to the itinerary'})
                    ]);
                    app.appendChild(band);
                    if (!S.tripFolded) app.appendChild(listOf(shownTrip, tripRow, true));
                } else {
                    app.appendChild(band);
                    app.appendChild(listOf(shownTrip, tripRow, false));
                }
            }
        }

        function listOf(items, fn, indent) {
            return h('div', {class: 'list' + (indent ? ' indent' : '')}, items.map(fn));
        }

        function groupByArea(items) {
            var order = [];
            var by = {};
            items.forEach(function (a) {
                var name = areaOf(a);
                if (!by[name]) {
                    by[name] = {name: name, items: []};
                    order.push(by[name]);
                }
                by[name].items.push(a);
            });
            // Alphabetical, "Unsorted" last. At scale, predictable beats
            // clever: the summary line already says where the work is.
            return order.sort(function (x, y) {
                if (x.name === UNSORTED) return 1;
                if (y.name === UNSORTED) return -1;
                return x.name.localeCompare(y.name);
            });
        }

        function areaTotals(all) {
            var t = {};
            all.forEach(function (a) {
                var k = areaOf(a);
                t[k] = (t[k] || 0) + 1;
            });
            return t;
        }

        function areaSection(g, totals) {
            var folded = !!S.folded[g.name];
            var shown = g.items.length;
            var total = (totals && totals[g.name]) || shown;
            var pending = g.items.filter(function (a) { return a.my_score == null; }).length;
            var top = g.items.reduce(function (m, a) {
                return (!m || (a.rank_score || 0) > (m.rank_score || 0)) ? a : m;
            }, null);

            // Say "4 of 12" while narrowed: "4 proposals" over a group of
            // twelve would simply be untrue.
            var sum = [shown === total
                ? total + (total === 1 ? ' proposal' : ' proposals')
                : shown + ' of ' + total];
            if (top && top.avg_score != null) sum.push('top ' + top.title + ' ' + top.avg_score.toFixed(1));

            var head = h('button', {
                class: 'area-head',
                type: 'button',
                'aria-expanded': folded ? 'false' : 'true',
                on: {
                    click: function () {
                        S.folded[g.name] = !folded;
                        render();
                    }
                }
            }, [
                h('span', {class: 'caret', text: folded ? '▸' : '▾'}),
                h('span', {class: 'nm', text: g.name}),
                h('span', {class: 'sum', text: sum.join(' · ')}),
                // Redundant once the "Needs my vote" lens is on — everything
                // shown needs it.
                (pending && !S.lens.mine) ? h('span', {class: 'todo', text: '· ' + pending + ' need your vote'}) : null
            ]);

            var frag = document.createDocumentFragment();
            frag.appendChild(head);
            if (!folded) frag.appendChild(listOf(g.items, card, true));
            return frag;
        }

        // ---- header, search, controls ---------------------------------------
        function header() {
            var left = h('div', {class: 'grow'}, [h('h1', {text: 'Vox'})]);

            if (S.board) {
                var total = (S.board.deciding || []).length;
                var pending = S.board.pending_for_me || 0;
                var msg = !total
                    ? null
                    : pending
                        ? pending + ' of ' + total + ' still need your vote'
                        : 'You have voted on all ' + total + '.';
                if (msg) left.appendChild(h('div', {class: 'status', text: msg}));
            }

            return h('div', {class: 'vox-head'}, [
                left,
                h('button', {
                    class: 'trek-btn trek-btn--primary',
                    type: 'button',
                    text: '+ Propose',
                    on: {click: function () { openActivityModal(null); }}
                })
            ]);
        }

        function searchbar(deciding) {
            var input = h('input', {
                class: 'trek-input',
                type: 'search',
                value: S.query,
                placeholder: 'Search proposals, notes, areas…',
                'aria-label': 'Search proposals'
            });

            // Re-rendering on every keystroke would steal the caret, so the
            // input is left alone and only the list below it is redrawn.
            input.addEventListener('input', function () {
                S.query = input.value;
                redrawBelowSearch();
            });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && S.query) {
                    S.query = '';
                    input.value = '';
                    redrawBelowSearch();
                }
            });

            var kids = [h('span', {class: 'glyph', text: '⌕'}), input];

            if (S.query.trim()) {
                var n = visible(deciding).length + visible(S.board.in_trip || []).length;
                kids.push(h('span', {class: 'count', text: n + (n === 1 ? ' match' : ' matches')}));
                kids.push(h('button', {
                    class: 'clear', type: 'button', text: '×', 'aria-label': 'Clear search',
                    on: {
                        click: function () {
                            S.query = '';
                            render();
                            focusSearch();
                        }
                    }
                }));
            }

            return h('div', {class: 'searchbar'}, kids);
        }

        function redrawBelowSearch() {
            var bar = app.querySelector('.searchbar');
            var caret = bar ? bar.querySelector('input').selectionStart : null;
            render();
            var again = app.querySelector('.searchbar input');
            if (again) {
                again.focus();
                if (caret != null) { try { again.setSelectionRange(caret, caret); } catch (_) {} }
            }
        }

        function focusSearch() {
            var i = app.querySelector('.searchbar input');
            if (i) i.focus();
        }

        function controls(deciding) {
            var sel = h('select', {class: 'trek-select', 'aria-label': 'Sort proposals'},
                SORTS.map(function (s) {
                    return h('option', {value: s[0], text: s[1], selected: S.sort === s[0]});
                }));
            sel.addEventListener('change', function () {
                S.sort = sel.value;
                loadBoard();
            });

            var kids = [sel];

            function lens(key, label, count) {
                if (!count && !S.lens[key]) return null;
                return h('button', {
                    class: 'lens',
                    type: 'button',
                    'aria-pressed': S.lens[key] ? 'true' : 'false',
                    on: {
                        click: function () {
                            S.lens[key] = !S.lens[key];
                            render();
                        }
                    }
                }, [
                    document.createTextNode(label),
                    count ? h('span', {class: 'n', text: count}) : null
                ]);
            }

            kids.push(lens('mine', 'Needs my vote', deciding.filter(function (a) { return a.my_score == null; }).length));
            kids.push(lens('split', 'Divided', deciding.filter(function (a) { return a.split; }).length));
            kids.push(lens('ready', 'Everyone voted', deciding.filter(isReady).length));

            if ((S.board.areas || []).length > 1) {
                kids.push(h('button', {
                    class: 'lens',
                    type: 'button',
                    'aria-pressed': S.group ? 'true' : 'false',
                    text: 'By area',
                    on: {
                        click: function () {
                            S.group = !S.group;
                            S.groupTouched = true;
                            render();
                        }
                    }
                }));
            }

            return h('div', {class: 'controls'}, kids);
        }

        // ---- the card ------------------------------------------------------
        function card(a) {
            // Inside an area section the chip would just repeat the heading.
            var showArea = !!a.area_name && !S.group;

            var kids = [
                h('div', {class: 'act-top'}, [
                    h('span', {class: 'act-name', text: a.title}),
                    showArea ? h('span', {class: 'trek-chip', text: a.area_name}) : null,
                    a.split ? h('span', {class: 'trek-chip trek-chip--warning', text: 'Divided', title: 'Some are keen, some would rather not'}) : null,
                    // On the title row rather than a row of its own: a long board
                    // cannot afford a line per card for a secondary link.
                    isHttp(a.url) ? h('button', {
                        class: 'link-btn',
                        type: 'button',
                        text: '🔗 Link',
                        title: a.url,
                        'aria-label': 'Open the link for ' + a.title,
                        on: {click: function () { openLink(a.url); }}
                    }) : null,
                    overflow(a)
                ])
            ];

            if (a.description) {
                kids.push(h('div', {class: 'act-note', text: a.description, title: a.description}));
            }

            var waiting = waitingText(a);
            var canOpen = (a.voters && a.voters.length) || (a.missing && a.missing.length);

            kids.push(h('div', {class: 'verdict'}, [
                h('span', {class: 'score' + (a.avg_score == null ? ' none' : ''), text: scoreText(a)}),
                a.avg_score == null ? null : h('span', {class: 'gauge'}, [h('i', {style: 'width:' + (a.avg_score / 5 * 100) + '%'})]),
                h('button', {
                    class: 'turnout' + (canOpen ? '' : ' plain'),
                    type: 'button',
                    text: turnoutText(a),
                    disabled: !canOpen,
                    'aria-expanded': S.open[a.id] ? 'true' : 'false',
                    title: canOpen ? 'See who voted' : null,
                    on: {
                        click: function () {
                            S.open[a.id] = !S.open[a.id];
                            render();
                        }
                    }
                }),
                waiting ? h('span', {class: 'waiting', text: waiting}) : null,
                h('span', {class: 'spacer'}),
                ballot(a)
            ]));

            if (S.open[a.id]) kids.push(breakdown(a));

            // The button appears only once the group has actually spoken. On a
            // long board that is the difference between a handful of live calls
            // to action and one dead button per row; before then, adding to the
            // trip is still one click away in the ··· menu.
            if (isReady(a)) {
                kids.push(h('div', {class: 'act-actions'}, [
                    h('span', {class: 'spacer'}),
                    h('button', {
                        class: 'trek-btn trek-btn--primary',
                        type: 'button',
                        text: 'Add to trip',
                        on: {click: function () { openAddToTripModal(a); }}
                    })
                ]));
            }

            return h('div', {class: 'trek-card act'}, kids);
        }

        function ballot(a) {
            var label = h('span', {
                class: 'vlabel live' + (a.my_score ? '' : ' none'),
                text: a._saving ? 'Saving…' : (a.my_score ? LABELS[a.my_score] : 'Not voted')
            });
            // Sizes the slot and never shows: whichever label is widest.
            var ghost = h('span', {class: 'vlabel ghost', text: WIDEST_LABEL});

            function show(n) {
                label.textContent = LABELS[n];
                label.className = 'vlabel live';
                paint(n);
            }

            function rest() {
                label.textContent = a._saving ? 'Saving…' : (a.my_score ? LABELS[a.my_score] : 'Not voted');
                label.className = 'vlabel live' + (a.my_score ? '' : ' none');
                paint(a.my_score || 0);
            }

            var buttons = [1, 2, 3, 4, 5].map(function (n) {
                return h('button', {
                    class: 'star',
                    type: 'button',
                    text: '★',
                    disabled: !!a._saving,
                    'aria-label': LABELS[n],
                    'aria-pressed': a.my_score === n ? 'true' : 'false',
                    on: {
                        mouseenter: function () { show(n); },
                        focus: function () { show(n); },
                        mouseleave: rest,
                        blur: rest,
                        click: function () { vote(a, n); }
                    }
                });
            });

            function paint(upTo) {
                buttons.forEach(function (b, i) { b.classList.toggle('on', i < upTo); });
            }

            paint(a.my_score || 0);

            return h('div', {class: 'ballot'}, [
                h('span', {class: 'stars', role: 'group', 'aria-label': 'Your preference'}, buttons),
                h('span', {class: 'vlabel-slot'}, [ghost, label])
            ]);
        }

        function breakdown(a) {
            var rows = (a.voters || []).map(function (v) {
                return h('div', {class: 'vrow'}, [
                    h('span', {class: 'nm', text: v.name}),
                    h('span', {class: 'sc', text: LABELS[v.score] || String(v.score)})
                ]);
            });
            (a.missing || []).forEach(function (m) {
                rows.push(h('div', {class: 'vrow absent'}, [
                    h('span', {class: 'nm', text: m.name}),
                    h('span', {class: 'sc', text: 'not voted'})
                ]));
            });
            return h('div', {class: 'breakdown'}, rows);
        }

        // No "open in itinerary" link: TREK's planner takes no URL parameter that
        // targets a place (only ?create=place|reservation|transport), and Vox is
        // itself a tab of /trips/<id> — so navigating there lands you exactly
        // where you already are. A button that cannot keep its promise is worse
        // than no button; the ✓ Added chip already says where the place went.
        function tripRow(a) {
            return h('div', {class: 'trek-card trip-row'}, [
                h('span', {class: 'trek-chip trek-chip--success', text: '✓ In the itinerary'}),
                h('span', {class: 'act-name', text: a.title}),
                a.area_name ? h('span', {class: 'trek-chip', text: a.area_name}) : null,
                h('span', {class: 'turnout plain', text: scoreText(a) + ' avg · ' + turnoutText(a)}),
                h('span', {class: 'spacer', style: 'flex:1 1 auto'}),
                overflow(a)
            ]);
        }

        // ---- overflow menu -------------------------------------------------
        function overflow(a) {
            var wrap = h('div', {class: 'menu-wrap'});
            var btn = h('button', {
                class: 'menu-btn',
                type: 'button',
                text: '···',
                'aria-label': 'More actions for ' + a.title,
                'aria-expanded': 'false'
            });
            wrap.appendChild(btn);

            var open = null;

            function close() {
                if (!open) return;
                open.remove();
                open = null;
                btn.setAttribute('aria-expanded', 'false');
                document.removeEventListener('click', onDoc, true);
                document.removeEventListener('keydown', onKey, true);
            }

            function onDoc(e) {
                if (!wrap.contains(e.target)) close();
            }

            function onKey(e) {
                if (e.key === 'Escape') { close(); btn.focus(); }
            }

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (open) { close(); return; }

                var items = [
                    h('button', {type: 'button', text: 'Edit', on: {click: function () { close(); openActivityModal(a); }}})
                ];

                // Nothing here undoes "add to trip". The itinerary is the source
                // of truth: delete the place there and Vox notices on the next
                // load, putting the proposal back up for decision by itself.
                if (a.trek_place_id == null) {
                    items.push(h('button', {
                        type: 'button', text: 'Add to trip',
                        on: {click: function () { close(); openAddToTripModal(a); }}
                    }));
                }

                if (a.can_delete) {
                    items.push(h('button', {
                        class: 'danger', type: 'button', text: 'Delete proposal',
                        on: {click: function () { close(); confirmDelete(a); }}
                    }));
                }

                open = h('div', {class: 'menu trek-menu-enter', role: 'menu'}, items);
                wrap.appendChild(open);
                btn.setAttribute('aria-expanded', 'true');
                document.addEventListener('click', onDoc, true);
                document.addEventListener('keydown', onKey, true);
            });

            return wrap;
        }

        // ---- destructive + itinerary actions --------------------------------
        function confirmDelete(a) {
            ask({
                title: 'Delete this proposal?',
                message: 'Every vote cast on "' + a.title + '" goes with it. This cannot be undone.',
                confirmLabel: 'Delete',
                danger: true
            }).then(function (yes) {
                if (!yes) return;
                api('/activities?id=' + encodeURIComponent(a.id), 'DELETE')
                    .then(function () {
                        trek.notify('success', 'Proposal deleted');
                        loadBoard();
                    })
                    .catch(function (e) { trek.notify('error', e && e.message ? e.message : 'Could not delete'); });
            });
        }

        // ---- modal shell ----------------------------------------------------
        function modal(title, fields, primaryLabel, onSubmit, opts) {
            opts = opts || {};
            var box = h('div', {class: 'modal trek-modal-enter'});
            var backdrop = h('div', {class: 'backdrop trek-backdrop-enter'}, [box]);
            var closers = [];

            function close() {
                backdrop.remove();
                document.removeEventListener('keydown', onKey, true);
                var fns = closers;
                closers = [];
                fns.forEach(function (fn) { fn(); });
            }

            function onKey(e) {
                if (e.key === 'Escape') close();
            }

            backdrop.addEventListener('click', function (e) {
                if (e.target === backdrop) close();
            });
            document.addEventListener('keydown', onKey, true);

            box.appendChild(h('h2', {text: title}));
            fields.forEach(function (f) { box.appendChild(f); });

            var submit = h('button', {
                class: 'trek-btn grow ' + (opts.danger ? 'trek-btn--danger' : 'trek-btn--primary'),
                type: 'button',
                text: primaryLabel
            });
            submit.addEventListener('click', function () {
                submit.disabled = true;
                var done = onSubmit(close);
                if (done && done.then) done.catch(function () {}).then(function () { submit.disabled = false; });
                else submit.disabled = false;
            });

            box.appendChild(h('div', {class: 'modal-actions'}, [
                h('button', {class: 'trek-btn trek-btn--ghost', type: 'button', text: opts.cancelLabel || 'Cancel', on: {click: close}}),
                submit
            ]));

            document.body.appendChild(backdrop);
            setTimeout(function () { submit.focus(); }, 40);
            return {
                close: close,
                box: box,
                onClose: function (fn) { closers.push(fn); }
            };
        }

        /**
         * Ask before doing something destructive.
         *
         * The host renders a native dialog when it can, and that is the nicer
         * one. But it is not always there: an older design kit has no
         * trek.confirm at all, and a frame sandboxed without allow-modals
         * silently answers "no" to any dialog it cannot draw. Either way the
         * click would appear to do nothing, which for a destructive action is
         * the worst possible failure — so there is always our own dialog behind
         * it. Resolves false on cancel, Escape or a click on the backdrop.
         */
        function ask(opts) {
            if (window.trek && typeof trek.confirm === 'function') {
                try {
                    var p = trek.confirm(opts);
                    if (p && typeof p.then === 'function') return p;
                } catch (_) {
                    /* host refused outright — fall through to our own */
                }
            }
            return ownConfirm(opts);
        }

        function ownConfirm(opts) {
            return new Promise(function (resolve) {
                var settled = false;
                function done(v) {
                    if (settled) return;
                    settled = true;
                    resolve(v);
                }
                var m = modal(
                    opts.title || 'Are you sure?',
                    [h('p', {class: 'trek-muted', style: 'margin:0;font-size:13.5px', text: opts.message || ''})],
                    opts.confirmLabel || 'Confirm',
                    function (close) { done(true); close(); },
                    {danger: !!opts.danger, cancelLabel: opts.cancelLabel}
                );
                // Cancel, Escape and the backdrop all route through close().
                m.onClose(function () { done(false); });
            });
        }

        function field(label, control, hint) {
            return h('div', {class: 'field'}, [
                h('label', {class: 'trek-label', text: label}),
                control,
                hint ? h('span', {class: 'hint', text: hint}) : null
            ]);
        }

        // ---- propose / edit --------------------------------------------------
        function openActivityModal(existing) {
            var isEdit = !!existing;
            var titleInput = h('input', {class: 'trek-input', placeholder: 'What should we do?', value: isEdit ? existing.title : ''});
            var descInput = h('textarea', {class: 'trek-textarea', rows: 2, placeholder: 'Anything the group should know?'});
            descInput.value = isEdit ? (existing.description || '') : '';
            var urlInput = h('input', {class: 'trek-input', placeholder: 'https://…', value: isEdit ? (existing.url || '') : ''});

            var area = areaPicker(isEdit ? existing.area_name : null);

            // Area sits second, not last. A dropdown pinned to the bottom of a
            // scrollable dialog opens into the clipped edge of it, and you have
            // to scroll the dialog to read your own options.
            var fields = [
                field('Title', titleInput),
                area.field,
                field('Notes', descInput),
                field('Link', urlInput)
            ];

            modal(isEdit ? 'Edit proposal' : 'Propose an activity', fields, isEdit ? 'Save' : 'Propose', function (close) {
                var title = titleInput.value.trim();
                if (!title) {
                    trek.notify('warning', 'A title is needed');
                    titleInput.focus();
                    return;
                }

                return area.resolve().then(function (areaId) {
                    var payload = {
                        title: title,
                        description: descInput.value.trim(),
                        url: urlInput.value.trim(),
                        area_id: areaId,
                        trip_id: S.tripId
                    };
                    if (isEdit) payload.id = existing.id;
                    return api('/activities', isEdit ? 'PUT' : 'POST', payload);
                }).then(function () {
                    close();
                    trek.notify('success', isEdit ? 'Proposal updated' : 'Proposal added');
                    return loadBoard();
                }).catch(function (e) {
                    trek.notify('error', e && e.message ? e.message : 'Could not save');
                    throw e;
                });
            });

            setTimeout(function () { titleInput.focus(); titleInput.select(); }, 60);
        }

        /**
         * One field that both picks an existing area and creates a new one.
         *
         * It replaces a <select> plus a hidden "+ New area…" input, for two
         * reasons. A native-style dropdown at the foot of a scrollable dialog
         * opens into the clipped edge of it — you end up scrolling the dialog to
         * read the list you just opened. And with a dozen areas a flat select is
         * a scroll of its own: typing two letters beats hunting.
         *
         * Suggestions render IN FLOW, never as a floating layer, so there is
         * nothing that can be clipped by an ancestor's overflow.
         */
        function areaPicker(currentName) {
            var areas = (S.board.areas || []).slice()
                .sort(function (x, y) { return x.name.localeCompare(y.name); });

            var input = h('input', {
                class: 'trek-input',
                value: currentName || '',
                placeholder: areas.length ? 'Type to find or create — Kyoto, Day 3…' : 'Kyoto, Day 3, …',
                autocomplete: 'off',
                'aria-label': 'Area'
            });

            var list = h('div', {class: 'suggest'});

            function exact(name) {
                var n = name.trim().toLowerCase();
                if (!n) return null;
                return areas.filter(function (a) { return a.name.toLowerCase() === n; })[0] || null;
            }

            function draw() {
                clear(list);
                var q = input.value.trim().toLowerCase();
                var hits = (q
                    ? areas.filter(function (a) { return a.name.toLowerCase().indexOf(q) >= 0; })
                    : areas).slice(0, 6);

                hits.forEach(function (a) {
                    list.appendChild(h('button', {
                        class: 'suggest-item' + (a.name.toLowerCase() === q ? ' on' : ''),
                        type: 'button',
                        text: a.name,
                        on: {
                            click: function () {
                                input.value = a.name;
                                draw();
                                input.focus();
                            }
                        }
                    }));
                });

                // Say that submitting as-is would create something — but not
                // while the text is still a prefix of an area that exists, when
                // the person is plainly mid-way through typing that one.
                var typed = input.value.trim();
                var startsAnExisting = !!q && areas.some(function (a) { return a.name.toLowerCase().indexOf(q) === 0; });
                if (typed && !exact(typed) && !startsAnExisting) {
                    list.appendChild(h('span', {class: 'suggest-new', text: 'New area: ' + typed}));
                }
                if (!hits.length && !typed && areas.length) {
                    list.appendChild(h('span', {class: 'suggest-new', text: 'No areas yet'}));
                }
            }

            input.addEventListener('input', draw);
            input.addEventListener('focus', draw);
            draw();

            var fieldEl = h('div', {class: 'field'}, [
                h('label', {class: 'trek-label', text: 'Area'}),
                input,
                list,
                h('span', {
                    class: 'hint',
                    text: 'A label to group proposals by — a city, a day. Not a map location. Leave it empty for none.'
                })
            ]);

            return {
                field: fieldEl,
                // An exact match reuses that area; anything else is created.
                // POST /areas is idempotent — it hands back the existing row on a
                // name clash — so a race with another member cannot duplicate.
                resolve: function () {
                    var typed = input.value.trim();
                    if (!typed) return Promise.resolve(null);
                    var hit = exact(typed);
                    if (hit) return Promise.resolve(hit.id);
                    return api('/areas', 'POST', {name: typed, trip_id: S.tripId})
                        .then(function (ar) { return ar.id; });
                }
            };
        }

        // ---- add to trip -----------------------------------------------------
        function openAddToTripModal(a) {
            var nameInput = h('input', {class: 'trek-input', value: a.title});
            // A good geocoding query, not a claim about the address: the area is
            // a grouping label, so it is a hint here and nothing more.
            var addrInput = h('input', {
                class: 'trek-input',
                value: a.area_name ? a.title + ', ' + a.area_name : a.title,
                placeholder: 'Address or place name'
            });
            var latInput = h('input', {class: 'trek-input', placeholder: 'Latitude', inputmode: 'decimal'});
            var lngInput = h('input', {class: 'trek-input', placeholder: 'Longitude', inputmode: 'decimal'});
            var notesInput = h('textarea', {class: 'trek-textarea', rows: 2});
            notesInput.value = 'From Vox: ' + a.title;

            var status = h('span', {class: 'hint'});
            var searchBtn = h('button', {class: 'trek-btn trek-btn--secondary', type: 'button', text: 'Search'});

            searchBtn.addEventListener('click', function () {
                var q = addrInput.value.trim();
                if (!q) {
                    status.textContent = 'Type something to search for.';
                    return;
                }
                searchBtn.disabled = true;
                status.textContent = 'Searching…';
                api('/geocode?address=' + encodeURIComponent(q))
                    .then(function (r) {
                        if (r.success) {
                            latInput.value = r.lat.toFixed(6);
                            lngInput.value = r.lng.toFixed(6);
                            addrInput.value = r.address || q;
                            status.textContent = 'Found on the map.';
                        } else {
                            status.textContent = (r.error || 'No match') + ' — you can still add it without coordinates.';
                        }
                    })
                    .catch(function () {
                        status.textContent = 'Search unavailable — you can still add it without coordinates.';
                    })
                    .then(function () { searchBtn.disabled = false; });
            });

            var fields = [
                field('Name in the itinerary', nameInput),
                h('div', {class: 'field'}, [
                    h('label', {class: 'trek-label', text: 'Address'}),
                    h('div', {class: 'pair'}, [addrInput, searchBtn]),
                    status
                ]),
                h('div', {class: 'field'}, [
                    h('label', {class: 'trek-label', text: 'Coordinates'}),
                    h('div', {class: 'pair'}, [latInput, lngInput]),
                    h('span', {class: 'hint', text: 'Optional. Leave empty and Vox will try to find them.'})
                ]),
                field('Notes', notesInput)
            ];

            if (a.missing && a.missing.length) {
                fields.unshift(h('div', {class: 'trek-chip trek-chip--warning', style: 'align-self:flex-start', text: waitingText(a)}));
            }

            modal('Add to the trip', fields, 'Add to trip', function (close) {
                var name = nameInput.value.trim();
                if (!name) {
                    trek.notify('warning', 'A name is needed');
                    nameInput.focus();
                    return;
                }
                var payload = {
                    activityId: a.id,
                    name: name,
                    address: addrInput.value.trim(),
                    notes: notesInput.value.trim(),
                    url: a.url || ''
                };
                var lat = parseFloat(latInput.value);
                var lng = parseFloat(lngInput.value);
                if (isFinite(lat) && isFinite(lng)) {
                    payload.lat = lat;
                    payload.lng = lng;
                }

                return api('/add-to-trip', 'POST', payload)
                    .then(function (r) {
                        close();
                        trek.notify('success', r.has_coordinates
                            ? 'Added to the itinerary, on the map'
                            : 'Added to the itinerary, without coordinates');
                        return loadBoard();
                    })
                    .catch(function (e) {
                        trek.notify('error', e && e.message ? e.message : 'Could not add it');
                        throw e;
                    });
            });
        }

        // ---- placeholders -----------------------------------------------------
        function noMatches() {
            var bits = [];
            if (S.query.trim()) bits.push('"' + S.query.trim() + '"');
            if (S.lens.mine) bits.push('needs my vote');
            if (S.lens.split) bits.push('divided');
            if (S.lens.ready) bits.push('everyone voted');

            return h('div', {class: 'trek-card empty'}, [
                h('h2', {text: 'Nothing matches'}),
                h('p', {text: 'No proposal matches ' + bits.join(' + ') + '.'}),
                h('button', {
                    class: 'trek-btn trek-btn--secondary',
                    type: 'button',
                    text: 'Clear search and filters',
                    on: {
                        click: function () {
                            S.query = '';
                            S.lens = {mine: false, split: false, ready: false};
                            render();
                        }
                    }
                })
            ]);
        }

        function firstRun() {
            return h('div', {class: 'trek-card empty'}, [
                h('h2', {text: 'Nothing on the table yet'}),
                h('p', {text: 'Propose something you would like to do. Everyone in the trip rates it, the group\'s picks rise to the top, and the winners go straight into the itinerary.'}),
                h('button', {
                    class: 'trek-btn trek-btn--primary',
                    type: 'button',
                    text: '+ Propose the first activity',
                    on: {click: function () { openActivityModal(null); }}
                })
            ]);
        }

        function noTrip() {
            return h('div', {class: 'trek-card empty'}, [
                h('h2', {text: 'No trip open'}),
                h('p', {text: 'Vox lives inside a trip. Open one and pick the Vox tab to vote on its activities.'})
            ]);
        }

        // ---- boot --------------------------------------------------------------
        if (!window.trek) {
            app.appendChild(h('div', {class: 'trek-card'}, [
                h('div', {class: 'trek-title', text: 'Vox needs the TREK host'}),
                h('p', {class: 'trek-muted', text: 'This page runs inside a TREK trip. Open it from the Vox tab.'})
            ]));
            return;
        }

        trek.onContext(function (c) {
            var tripId = c && c.tripId != null ? String(c.tripId) : null;
            var changed = tripId !== S.tripId;
            S.tripId = tripId;
            S.userId = c && c.userId != null ? String(c.userId) : null;
            if (changed) loadBoard();
            else render();
        });

        // Core activity on the trip in view arrives as a name only — a place
        // deleted by hand is exactly the case /board reconciles, so refetch.
        trek.onEvent(function (event) {
            if (/^place:/.test(String(event || ''))) loadBoard();
        });

        render();
    })();
</script>
</body>
</html>
